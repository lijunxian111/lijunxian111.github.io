name: Get Citation Data

on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * *'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: google_scholar_crawler/requirements.txt

      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r google_scholar_crawler/requirements.txt

      - name: Fetch Google Scholar citations
        env:
          GOOGLE_SCHOLAR_ID: "U-b_eXkAAAAJ"
        run: |
          cd google_scholar_crawler
          python main.py

      - name: Push citation data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd google_scholar_crawler/results

          git init
          git config user.email "1713546501@qq.com"
          git config user.name "lijunxian111"

          git add *.json
          git commit -m "Updated Citation Data"

          git remote add origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          git push origin HEAD:google-scholar-stats --force
